name: Deals scrape

on:
  schedule:
    - cron: '17 22 * * *' # 每天台北時間 06:17
  workflow_dispatch:
    inputs:
      discover:
        description: '同時存探勘快照（deals/raw）'
        type: boolean
        default: false
  push:
    branches: [claude/sharp-cannon-5364vx]
    paths: ['scripts/deals/**', '.github/workflows/deals.yml']

permissions:
  contents: write

concurrency:
  group: deals-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Discover
        if: inputs.discover
        run: node scripts/deals/discover.mjs
        continue-on-error: true
      - name: Scrape
        run: node scripts/deals/scrape.mjs
      - name: Commit data
        if: success() || failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -A deals
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "Update deals data $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git fetch origin "$BR" && git rebase "origin/$BR" && git push origin "HEAD:refs/heads/$BR" && exit 0
            sleep $((i * 5))
          done
          exit 1
