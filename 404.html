<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>找不到頁面</title>
    <script>
      // 連結被聊天軟體或 Markdown 多帶了字元時（例：/deals/**（…）），導回正確頁面
      (function () {
        var p = decodeURIComponent(location.pathname);
        var base = (p.match(/^\/[^/]+\//) || ['/'])[0];
        if (/\/deals/i.test(p) && p !== base + 'deals/') location.replace(base + 'deals/' + location.hash);
        else if (/\/groupbuy/i.test(p) && p !== base + 'groupbuy/') location.replace(base + 'groupbuy/' + location.hash);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif; background: #f5f6f8; color: #141a26; }
      @media (prefers-color-scheme: dark) { body { background: #0e121a; color: #e8ecf3; } a { color: #fbbf24; } }
      main { text-align: center; padding: 24px 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>找不到這個頁面</h1>
      <p><a href="/English-Learning-/">Small Talk Society</a>　·　<a href="/English-Learning-/deals/">優惠雷達</a>　·　<a href="/English-Learning-/groupbuy/">團購雷達</a></p>
    </main>
  </body>
</html>
